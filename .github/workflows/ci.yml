name: RiskPilot CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps (full)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz,binning]" -c ci/constraints-ci.txt
      - name: Dependency diagnostics
        run: |
          python - <<'PY'
          import sys
          import numpy
          import pandas
          import scipy
          import sklearn

          print("python", sys.version)
          print("numpy", numpy.__version__, numpy.__file__)
          print("pandas", pandas.__version__, pandas.__file__)
          print("scipy", scipy.__version__, scipy.__file__)
          print("sklearn", sklearn.__version__, sklearn.__file__)
          PY
          python -m pip check
          python -m pip freeze
      - name: Run tests
        run: |
          pytest -q --cov=riskpilot.evaluation
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: success()

  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Commit build
        run: |
          if [ ! -d docs ]; then
            echo "docs directory not found"
            exit 1
          fi
          docs_tmp="$(mktemp -d)"
          trap 'rm -rf "$docs_tmp"' EXIT
          cp -R docs/. "$docs_tmp"/

          git config user.name  "gh-pages bot"
          git config user.email "bot@example.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -R "$docs_tmp"/. .
          git add .
          git commit -m "docs: update $(date -u +%Y-%m-%d)"
          git push -f origin gh-pages
